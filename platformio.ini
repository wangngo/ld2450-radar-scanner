; LD2450 handheld radar scanner
; Board target: Waveshare ESP32-S3-Touch-LCD-2.8 (240x320 ST7789) — pins chưa verify trên board thật.

[platformio]
default_envs = s3_web

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17

[env:s3_web]
; ESP32-S3 DevKitC N16R8 (board của W), radar UART RX=GPIO18 TX=GPIO17, web qua WiFi AP
platform = espressif32@6.9.0  ; = Arduino core 2.0.17 (framework 3.20017), ghim để build lặp lại được
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRADAR_RX_PIN=18
    -DRADAR_TX_PIN=17
monitor_speed = 115200
test_ignore = *

[env:waveshare_s3_28]
platform = espressif32@6.9.0  ; = Arduino core 2.0.17 (framework 3.20017), ghim để build lặp lại được
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRADAR_RX_PIN=44
    -DRADAR_TX_PIN=43
monitor_speed = 115200
test_ignore = *

[env:i2cscan]
; Chẩn đoán I2C BMI160 — Serial ra UART0 (cổng usbserial), KHÔNG dùng CDC native
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = -<*> +<../diag/i2cscan.cpp>
monitor_speed = 115200
test_ignore = *

[env:s3_log]
; = s3_web nhưng Serial ra UART0 (cổng usbserial) để đọc log chẩn đoán. Tạm thời.
extends = env:s3_web
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DRADAR_RX_PIN=18
    -DRADAR_TX_PIN=17

[env:led_test]
; Test chân LED RGB on-board (48 vs 38). Tạm thời.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = -<*> +<../diag/led_test.cpp>
monitor_speed = 115200
test_ignore = *
